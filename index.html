<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid display: sample layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
    
            text-align: center;
            font-size: 60px;
            padding-top: 20px;
            color: yellowgreen;
            text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000;
            
        }

        body {
            background-image: url(space_background.gif);
            background-repeat: repeat-x;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            height: 100vh;
            margin: 0;


        }

        body {
            padding: 40px;
            font-family: Helvetica, Arial, sans-serif;
            
        }

        h3 {
            padding: 10px;
            font-size: 14px;
            color: greenyellow;
            letter-spacing: 0.03em;
            border-top: 1px solid black;
        }

        .grid-container {
            margin: 16px 0 40px 0;
            display: grid;
            column-gap: 30px;
            row-gap: 30px;
            
        }

        .grid-item {
            padding: 8px;
            font-size: 30px;
            color: rgb(237, 238, 234);
            text-align: center;
            background-color: rgba(115, 229, 77, 0.8);
            opacity: 100%;
            min-height: 100px;
            box-shadow: 0px 0px 10px 3px rgba(115, 229, 77, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        .more-news {
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: repeat(5, 1fr);
        }

        */ .more-news>.featured {
            grid-column-start: 1;
            grid-column-end: 3;
            /* grid-column: 1 / 3; */
            grid-row-start: 1;
            grid-row-end: 4;
            /* grid-row: 1 / 4; */
        } */
        .wellness {
            grid-template-columns: repeat(5, 1fr);
        }

        a:link {
            color: whitesmoke;
            text-decoration: none;
        }

        a:visited {
            color: rgb(245, 245, 245);
        }

        a:hover {
            color: rgb(245, 245, 245, 0.6);
            font-size: larger;
        }

    </style>
</head>
